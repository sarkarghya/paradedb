name: Experimental physical failover artifacts

# Fork-only validation; never publish or deploy this experimental library.
on:
  workflow_dispatch:
  push:
    branches:
      - fix/experimental-physical-failover-v0.26.3
      - 'fork/**'

permissions:
  contents: read

concurrency:
  group: experimental-physical-failover-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: PG18 failover (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Verify exact release base and unchanged SQL and dependency lock
        id: release
        run: |
          set -euo pipefail
          release=$(jq -r .upstreamCommit fork/release.json)
          version=$(jq -r .extensionVersion fork/release.json)
          git merge-base --is-ancestor "$release" HEAD
          grep -Fqx "version = \"$version\"" Cargo.toml
          git diff --exit-code "$release" HEAD -- Cargo.lock pg_search/sql pg_search/pg_search.control
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v4
      - name: Compile and test before exporting
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile.experimental-ha
          target: artifacts
          platforms: linux/${{ matrix.arch }}
          outputs: type=local,dest=artifacts/physical-failover
          cache-from: type=gha,scope=physical-failover-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=physical-failover-${{ matrix.arch }}
      - name: Build disposable Patroni test image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile.experimental-ha
          target: patroni-test
          platforms: linux/${{ matrix.arch }}
          tags: paradedb-physical-failover:ci
          load: true
      - name: Test Patroni elections and rejoining
        env:
          PARADEDB_HA_IMAGE: paradedb-physical-failover:ci
        run: python3 tests/physical_failover/smoke.py
      - name: Record revision and checksums
        shell: bash
        run: |
          set -euo pipefail
          git archive --format=tar HEAD | gzip > artifacts/physical-failover/SOURCE.tar.gz
          cd artifacts/physical-failover
          printf 'source=%s\nplatform=linux/%s\npostgres=18\nfeature=experimental-physical-failover\nstandby_search_reads=disabled\n' \
            "$GITHUB_SHA" '${{ matrix.arch }}' > BUILD-INFO
          sed -nE "s/^default_version = '(.*)'$/extension_version=\1/p" \
            usr/share/postgresql/18/extension/pg_search.control >> BUILD-INFO
          find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > "$RUNNER_TEMP/physical-failover-SHA256SUMS"
          mv "$RUNNER_TEMP/physical-failover-SHA256SUMS" SHA256SUMS
      - uses: actions/upload-artifact@v7
        with:
          name: pg_search-${{ steps.release.outputs.version }}-pg18-linux-${{ matrix.arch }}-experimental-failover
          path: artifacts/physical-failover/
          if-no-files-found: error
          retention-days: 14
